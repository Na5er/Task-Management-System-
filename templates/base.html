<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TaskFlow{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container" style="max-width: 1200px; margin: 0 auto;">
        <header style="padding: 2rem 0; border-bottom: 1px solid var(--bg-light);">
            <h1 style="margin: 0; display: flex; align-items: center; gap: 0.5rem;">
                <a href="{{ url_for('dashboard') }}" style="text-decoration: none; color: var(--text-dark);">
                    📋 TaskFlow
                </a>
            </h1>
        </header>

        {% block content %}{% endblock %}
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
